<!DOCTYPE html>
<html>
	<head>
        <meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>World Database Lookup</title>

		<link href="world.css" type="text/css" rel="stylesheet" />
		<script src="world.js" type="text/javascript" defer></script>
	</head>

	<body>
		<header>
			<div class="header-content">
				<p class="eyebrow">Explore the world</p>
				<h1>World Database Lookup</h1>
				<p class="intro">Search countries by name and discover who leads them.</p>
			</div>
		</header>

		<main>
			<section class="lookup-card" aria-labelledby="search-title">
				<div class="section-heading">
					<p class="eyebrow">Country search</p>
					<h2 id="search-title">Find a country</h2>
					<p>Enter a full name or just a few letters. Leave the field empty to see every country.</p>
				</div>

				<div id="controls">
					<label for="country">Country name</label>
					<div class="search-row">
						<input id="country" type="search" name="country" placeholder="e.g. Jamaica or United" autocomplete="off" />
						<button id="lookup" type="button">Lookup</button>
					</div>
				</div>

				<section class="results" aria-labelledby="results-title">
					<h2 id="results-title">Results</h2>
					<div id="result" aria-live="polite">
						<p class="empty-state">Your country search results will appear here.</p>
					</div>
				</section>
			</section>
		</main>

	</body>
</html>
